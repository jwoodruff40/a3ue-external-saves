name = "[A3UE] External Saves"
author = "Creep'nCrunch"
prefix = "a3ue_extsaves"
mainprefix = "z"

[files]
include = [
    "a3ue_extsaves.paa",
    "LICENSE",
    "README.md",
    "mod.cpp",
    "py3u/*"
]

[preprocessor]
runtime_macros = true

[hemtt.launch.default]
workshop = [
    "450814997", # CBA_A3
    "3020755032", # Antistasi Ultimate
    "1751569185", # Pythia
]

[hemtt.launch.debugging]
extends = "default"
workshop = [
    "1779063631", # ZEN
    "3499977893", # Advanced Developer Tools
]

[version]
git_hash = 0
